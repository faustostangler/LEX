services:
  postgres:
    image: postgres:16-alpine
    container_name: lex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex
      POSTGRES_DB: lex
    ports:
      - "5432:5432"
    volumes:
      - lex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex -d lex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lex_postgres_data:
